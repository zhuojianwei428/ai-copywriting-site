<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CopyTools — Under Reconstruction</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <meta name="robots" content="noindex,follow" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="CopyTools" />
  <meta property="og:title" content="CopyTools — Under Reconstruction" />
  <meta property="og:description" content="We're rebuilding CopyTools. Real-tested AI copywriting tool reviews are coming back soon." />
  <meta property="og:url" content="https://aiwritereview.com/" />
  <meta property="og:image" content="https://aiwritereview.com/ai-copywriting-tools-og.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <style>
    :root { --bg:#0b0e14; --fg:#e8ecf1; --muted:#8a93a3; --accent:#6ea8fe; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body {
      min-height:100vh; display:flex; align-items:center; justify-content:center;
      background:radial-gradient(1200px 600px at 50% -10%, #16203a 0%, var(--bg) 60%);
      color:var(--fg); font-family:"Outfit",system-ui,-apple-system,"Segoe UI",sans-serif;
    }
    .card { text-align:center; padding:48px 32px; max-width:640px; }
    .badge {
      display:inline-block; font-size:13px; letter-spacing:.18em; text-transform:uppercase;
      color:var(--accent); border:1px solid rgba(110,168,254,.4); border-radius:999px;
      padding:6px 14px; margin-bottom:24px;
    }
    h1 { font-size:clamp(28px,5vw,44px); line-height:1.1; margin-bottom:16px; font-weight:700; }
    p { color:var(--muted); font-size:17px; line-height:1.6; }
    .brand { margin-top:32px; font-size:14px; color:var(--muted); }
    .brand b { color:var(--fg); }
  </style>
</head>
<body>
  <main class="card">
    <span class="badge">Site under reconstruction</span>
    <h1>CopyTools is being rebuilt.</h1>
    <p>We're reworking how we test AI copywriting tools — same promise, cleaner site. Real, hands-on reviews that sound human are coming back soon.</p>
    <div class="brand"><b>CopyTools</b> &middot; aiwritereview.com</div>
  </main>
</body>
</html>
