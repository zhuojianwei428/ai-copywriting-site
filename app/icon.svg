      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- clipboard / review sheet -->
  <rect x="18" y="15" width="28" height="35" rx="4" fill="#ffffff"/>
  <rect x="25" y="10" width="14" height="6" rx="3" fill="#c7d2fe"/>
