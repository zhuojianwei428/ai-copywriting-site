<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CopyTools Admin - Tool Content Manager</title>
<!--SEO:START-->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..900&display=swap" />
<link rel="icon" type="image/svg+xml" href="../favicon.svg" />
<link rel="canonical" href="https://aiwritereview.com/admin/index.html" />
<meta name="robots" content="index,follow" />
<meta property="og:type" content="website" />
<meta property="og:site_name" content="CopyTools" />
<meta property="og:title" content="CopyTools Admin - Tool Content Manager" />
<meta property="og:description" content="CopyTools Admin - Tool Content Manager" />
<meta property="og:url" content="https://aiwritereview.com/admin/index.html" />
<meta property="og:image" content="https://aiwritereview.com/og.png" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta name="twitter:image" content="https://aiwritereview.com/og.png" />

<meta name="twitter:title" content="CopyTools Admin - Tool Content Manager" />
<meta name="twitter:description" content="CopyTools Admin - Tool Content Manager" />

<style>
:root {
  --bg: #0a0e1a;
  --bg2: #111827;
  --bg3: #1a2235;
  --surface: #151d2e;
  --border: #1e2d4a;
  --border2: #2a3f5f;
  --text: #e8ecf4;
  --text2: #94a3b8;
  --text3: #64748b;
  --accent: #6366f1;
  --accent-hover: #818cf8;
  --green: #10b981;
  --red: #ef4444;
  --orange: #f59e0b;
  --radius: 10px;
  --radius-sm: 6px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Inter', -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  overflow: hidden;
}

/* ---- Top Bar ---- */
.topbar {
  height: 56px;
  background: var(--bg2);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 20px;
  gap: 12px;
  flex-shrink: 0;
}
.topbar .logo {
  font-weight: 700;
  font-size: 16px;
  color: var(--text);
  display: flex;
  align-items: center;
  gap: 8px;
}
.topbar .logo .dot {
  width: 10px; height: 10px;
  background: var(--accent);
  border-radius: 50%;
  flex-shrink: 0;
}
.topbar .spacer { flex: 1; }
.topbar .status {
  font-size: 12px;
  color: var(--text3);
  padding: 4px 12px;
  background: var(--bg3);
  border-radius: 20px;
}

/* ---- Buttons ---- */
.btn {
  padding: 7px 16px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border2);
  background: var(--surface);
  color: var(--text);
  font-size: 13px;
  cursor: pointer;
  transition: all 0.15s;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-family: inherit;
}
.btn:hover { background: var(--bg3); border-color: var(--accent); }
.btn-primary {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
}
.btn-primary:hover { background: var(--accent-hover); }
.btn-success { background: var(--green); border-color: var(--green); color: #fff; }
.btn-success:hover { opacity: 0.9; }
.btn-sm { padding: 5px 12px; font-size: 12px; }

/* ---- Layout ---- */
.layout {
  display: flex;
  height: calc(100vh - 56px);
}

/* ---- Sidebar ---- */
.sidebar {
  width: 260px;
  background: var(--bg2);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  overflow: hidden;
}
.sidebar-header {
  padding: 16px 16px 12px;
  border-bottom: 1px solid var(--border);
}
.sidebar-header input {
  width: 100%;
  padding: 8px 12px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border2);
  background: var(--bg);
  color: var(--text);
  font-size: 13px;
  outline: none;
  font-family: inherit;
}
.sidebar-header input:focus { border-color: var(--accent); }
.sidebar-list {
  flex: 1;
  overflow-y: auto;
  padding: 8px;
}
.tool-item {
  padding: 10px 14px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 13px;
  transition: all 0.12s;
  margin-bottom: 2px;
  color: var(--text2);
}
.tool-item:hover { background: var(--bg3); color: var(--text); }
.tool-item.active {
  background: rgba(99,102,241,0.15);
  color: var(--text);
  border: 1px solid rgba(99,102,241,0.3);
}
.tool-item .score-badge {
  font-size: 11px;
  padding: 2px 8px;
  border-radius: 10px;
  font-weight: 600;
}
.score-a { background: rgba(16,185,129,0.15); color: #34d399; }
.score-b { background: rgba(99,102,241,0.15); color: #818cf8; }

/* ---- Main Editor ---- */
.editor {
  flex: 1;
  overflow-y: auto;
  padding: 28px 36px;
  background: var(--bg);
}
.editor-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 24px;
}
.editor-header h1 {
  font-size: 22px;
  font-weight: 700;
}
.editor-header .meta {
  display: flex;
  align-items: center;
  gap: 12px;
}

/* ---- Form Sections ---- */
.section-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  margin-bottom: 20px;
  overflow: hidden;
}
.section-head {
  padding: 14px 20px;
  background: var(--bg3);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 10px;
}
.section-head h3 {
  font-size: 14px;
  font-weight: 600;
  color: var(--text);
}
.section-head .section-num {
  width: 22px; height: 22px;
  background: var(--accent);
  color: #fff;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  font-weight: 700;
  flex-shrink: 0;
}
.section-body {
  padding: 18px 20px;
}
.section-body textarea {
  width: 100%;
  min-height: 120px;
  padding: 12px 14px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border2);
  background: var(--bg);
  color: var(--text);
  font-size: 14px;
  line-height: 1.65;
  resize: vertical;
  outline: none;
  font-family: inherit;
}
.section-body textarea:focus { border-color: var(--accent); }
.section-body textarea::placeholder { color: var(--text3); }
.section-hint {
  font-size: 12px;
  color: var(--text3);
  margin-top: 8px;
}
.empty-field {
  box-shadow: inset 0 0 0 1px var(--orange);
}

/* ---- Toast ---- */
.toast-container {
  position: fixed;
  top: 68px;
  right: 20px;
  z-index: 999;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.toast {
  padding: 10px 18px;
  border-radius: var(--radius-sm);
  font-size: 13px;
  animation: slideIn 0.25s ease;
  max-width: 360px;
}
.toast-ok { background: rgba(16,185,129,0.15); color: #34d399; border: 1px solid rgba(16,185,129,0.3); }
.toast-err { background: rgba(239,68,68,0.15); color: #fca5a5; border: 1px solid rgba(239,68,68,0.3); }
.toast-info { background: rgba(99,102,241,0.15); color: #a5b4fc; border: 1px solid rgba(99,102,241,0.3); }
@keyframes slideIn { from { transform: translateX(40px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

/* ---- Modal ---- */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  z-index: 1000;
  display: none;
  align-items: center;
  justify-content: center;
}
.modal-overlay.show { display: flex; }
.modal-box {
  background: var(--bg2);
  border: 1px solid var(--border2);
  border-radius: var(--radius);
  padding: 28px;
  max-width: 480px;
  width: 90%;
}
.modal-box h2 { font-size: 17px; margin-bottom: 12px; }
.modal-box p { font-size: 13px; color: var(--text2); line-height: 1.6; margin-bottom: 20px; }
.modal-box .modal-actions { display: flex; gap: 10px; justify-content: flex-end; }

/* ---- Build Log ---- */
.build-log {
  margin-top: 16px;
  padding: 14px 18px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  font-family: 'Cascadia Code', 'Fira Code', monospace;
  font-size: 12px;
  color: var(--text2);
  max-height: 200px;
  overflow-y: auto;
  white-space: pre-wrap;
  display: none;
}
.build-log.show { display: block; }

/* ---- Empty State ---- */
.empty-state {
  text-align: center;
  padding: 80px 20px;
  color: var(--text3);
}
.empty-state .icon { font-size: 48px; margin-bottom: 16px; }
.empty-state p { font-size: 14px; }

/* ---- Responsive ---- */
@media (max-width: 768px) {
  .sidebar { width: 200px; }
  .editor { padding: 20px; }
}
</style>
</head>
<body>

<!-- Toast Container -->
<div class="toast-container" id="toasts"></div>

<!-- Top Bar -->
<div class="topbar">
  <div class="logo"><span class="dot"></span> CopyTools Admin</div>
  <span class="status" id="status">No data loaded</span>
  <div class="spacer"></div>
  <button class="btn btn-sm" onclick="loadFromFile()" title="Load tools-data.json from disk">
    Load JSON
  </button>
  <button class="btn btn-sm btn-primary" onclick="downloadJSON()" title="Download edited data as JSON">
    Download JSON
  </button>
  <button class="btn btn-sm btn-success" onclick="showBuildModal()" title="Run _gen_tools.py to rebuild pages">
    Build Pages
  </button>
</div>

<div class="layout">
  <!-- Sidebar: Tool List -->
  <div class="sidebar">
    <div class="sidebar-header">
      <input type="text" id="searchTools" placeholder="Search tools..." oninput="filterTools()" />
    </div>
    <div class="sidebar-list" id="toolList"></div>
  </div>

  <!-- Main: Editor -->
  <div class="editor" id="editorArea">
    <div class="empty-state" id="emptyState">
      <div class="icon">&#128194;</div>
      <p>Load <strong>tools-data.json</strong> to start editing.<br/>Click "Load JSON" in the top bar.</p>
    </div>
  </div>
</div>

<!-- Build Confirmation Modal -->
<div class="modal-overlay" id="buildModal">
  <div class="modal-box">
    <h2>Build Static Pages</h2>
    <p>This will run <code>_gen_tools.py</code> to regenerate all 11 tool detail pages from the current data. Make sure you've saved your JSON first.</p>
    <div id="buildLog" class="build-log"></div>
    <div class="modal-actions">
      <button class="btn" onclick="hideBuildModal()">Cancel</button>
      <button class="btn btn-success" onclick="runBuild()">Build Now</button>
    </div>
  </div>
</div>

<script>
// ====== State ======
let appData = null;       // Full JSON data
let currentTool = null;   // Currently selected tool object
let currentIdx = -1;

// Section definitions
const SECTIONS = [
  { key: 'use_case',     label: 'Real use case',           hint: 'Describe real scenarios where this tool shines. Be specific.' },
  { key: 'download',     label: 'How to download & install', hint: 'Step-by-step download/install instructions. Include official URLs.' },
  { key: 'how_to_use',   label: 'How to use it',            hint: 'Practical usage guide. Walk through the main features and workflow.' },
  { key: 'price',        label: 'Pricing',                  hint: 'All pricing tiers, free trial info, what you get at each level.' },
  { key: 'comparison',   label: 'How it compares with other tools', hint: 'Honest comparison. Strengths vs competitors, where it loses.' },
  { key: 'combinations', label: 'Tool combinations that work well together', hint: 'Which tools pair well with this one? Workflow suggestions.' },
  { key: 'who_for',      label: 'Who should use this tool',  hint: 'Target audience. Who is this perfect for? Who should avoid it?' },
];

// ====== File Loading ======
function loadFromFile() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.json';
  input.onchange = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        appData = JSON.parse(ev.target.result);
        renderToolList();
        selectTool(0);
        updateStatus(`Loaded ${appData.tools.length} tools`);
        toast('JSON loaded successfully', 'ok');
      } catch(err) {
        toast('Invalid JSON file: ' + err.message, 'err');
      }
    };
    reader.readAsText(file);
  };
  input.click();
}

// Also try fetch from local server (if admin server is running)
async function loadFromServer() {
  try {
    const res = await fetch('/api/tools');
    if (res.ok) {
      appData = await res.json();
      renderToolList();
      selectTool(0);
      toast('Loaded from server', 'ok');
    }
  } catch(e) {
    // Server not available, ignore
  }
}

// ====== Render Sidebar ======
function renderToolList() {
  const container = document.getElementById('toolList');
  container.innerHTML = '';
  (appData.tools || []).forEach((t, i) => {
    const el = document.createElement('div');
    el.className = 'tool-item' + (i === currentIdx ? ' active' : '');
    el.innerHTML = `
      <span>${esc(t.name)}</span>
      <span class="score-badge ${t.score_class || 'score-b'}">${esc(t.score || '')}</span>
    `;
    el.onclick = () => selectTool(i);
    el.dataset.idx = i;
    container.appendChild(el);
  });
}

function filterTools() {
  const q = document.getElementById('searchTools').value.toLowerCase();
  document.querySelectorAll('.tool-item').forEach(el => {
    const name = el.textContent.toLowerCase();
    el.style.display = name.includes(q) ? '' : 'none';
  });
}

// ====== Select & Edit Tool ======
function selectTool(idx) {
  if (!appData || idx < 0 || idx >= appData.tools.length) return;
  currentIdx = idx;
  currentTool = appData.tools[idx];

  // Update sidebar active state
  document.querySelectorAll('.tool-item').forEach((el, i) => {
    el.classList.toggle('active', i === idx);
  });

  // Hide empty state
  document.getElementById('emptyState').style.display = 'none';

  // Render form
  renderEditor();
}

function renderEditor() {
  const area = document.getElementById('editorArea');
  let html = `
    <div class="editor-header">
      <h1>${esc(currentTool.name)} <span style="font-size:14px;color:var(--text3);font-weight:400">${esc(currentTool.slug)}</span></h1>
      <div class="meta">
        <span class="score-badge ${currentTool.score_class || 'score-b'}">${esc(currentTool.score || '')}</span>
      </div>
    </div>
  `;

  SECTIONS.forEach((sec, i) => {
    const val = currentTool[sec.key] || '';
    const isEmpty = !val.trim();
    html += `
      <div class="section-card">
        <div class="section-head">
          <span class="section-num">${i + 1}</span>
          <h3>${esc(sec.label)}</h3>
        </div>
        <div class="section-body">
          <textarea
            id="field_${sec.key}"
            class="${isEmpty ? 'empty-field' : ''}"
            placeholder="Enter content for: ${esc(sec.label)}"
            oninput="onFieldChange('${sec.key}', this)"
          >${esc(val)}</textarea>
          <div class="section-hint">${esc(sec.hint)}</div>
        </div>
      </div>
    `;
  });

  // Remove old dynamic content but keep structure
  const oldForm = area.querySelector('.editor-form');
  if (oldForm) oldForm.remove();

  const form = document.createElement('div');
  form.className = 'editor-form';
  form.innerHTML = html;
  area.appendChild(form);
}

function onFieldChange(key, textarea) {
  if (!currentTool) return;
  currentTool[key] = textarea.value;
  // Toggle empty styling
  textarea.classList.toggle('empty-field', !textarea.value.trim());
}

// ====== Save / Download ======
function downloadJSON() {
  if (!appData) { toast('No data to download', 'err'); return; }
  // Update timestamp
  appData._meta.last_updated = new Date().toISOString();
  const blob = new Blob([JSON.stringify(appData, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'tools-data.json';
  a.click();
  URL.revokeObjectURL(url);
  toast('JSON downloaded. Place it in project root.', 'ok');
}

// ====== Build ======
function showBuildModal() {
  document.getElementById('buildModal').classList.add('show');
  document.getElementById('buildLog').classList.remove('show');
  document.getElementById('buildLog').textContent = '';
}

function hideBuildModal() {
  document.getElementById('buildModal').classList.remove('show');
}

async function runBuild() {
  const logEl = document.getElementById('buildLog');
  logEl.classList.add('show');
  logEl.textContent = 'Starting build...\n';

  try {
    const res = await fetch('/api/build', { method: 'POST' });
    const result = await res.json();
    if (result.ok) {
      logEl.textContent += '\n' + (result.output || 'Build complete!');
      toast('Pages built successfully!', 'ok');
    } else {
      logEl.textContent += '\nError: ' + (result.error || 'Unknown error');
      toast('Build failed: ' + (result.error || 'Unknown'), 'err');
    }
  } catch(e) {
    logEl.textContent += '\n\nServer not running.\n\nManual build:\n  1. Download JSON first\n  2. Place in project root\n  3. Run: python _gen_tools.py';
    toast('Build server not available. See manual instructions below.', 'info');
  }
}

// ====== Utilities ======
function esc(s) {
  if (!s) return '';
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function updateStatus(text) {
  document.getElementById('status').textContent = text;
}

function toast(msg, type='info') {
  const c = document.getElementById('toasts');
  const t = document.createElement('div');
  t.className = `toast toast-${type}`;
  t.textContent = msg;
  c.appendChild(t);
  setTimeout(() => t.remove(), 3500);
}

// ====== Init ======
// Try loading from server on startup, otherwise wait for file load
loadFromServer();

// Keyboard shortcut: Ctrl+S to download
document.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key === 's') {
    e.preventDefault();
    downloadJSON();
  }
});
</script>

</body>
</html>
